name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # centmem uses cgo (sqlite-vec + mattn/go-sqlite3), so each target is built
    # on a native runner whose GOOS/GOARCH matches the desired platform. The
    # artifact is named from `go env` so it always reflects the real binary.
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os: macos-latest        # arm64
          - goos: darwin
            goarch: amd64
            os: macos-13            # Intel x64
          - goos: linux
            goarch: amd64
            os: ubuntu-latest       # x64
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04-arm    # arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      # Derive the real GOOS/GOARCH from the native runner and build with it, so
      # the artifact name (and SHA256SUMS) always match the binary architecture.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: |
          export GOOS="$(go env GOOS)"
          export GOARCH="$(go env GOARCH)"
          echo "Building for ${GOOS}/${GOARCH} (expected ${{ matrix.goos }}/${{ matrix.goarch }})"
          if [ "$GOOS/$GOARCH" != "${{ matrix.goos }}/${{ matrix.goarch }}" ]; then
            echo "::error::runner architecture mismatch: got ${GOOS}/${GOARCH}, expected ${{ matrix.goos }}/${{ matrix.goarch }}"
            exit 1
          fi
          go build -tags fts5 -o "centmem-${GOOS}-${GOARCH}" ./cmd/centmem

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: centmem-${{ matrix.goos }}-${{ matrix.goarch }}
          path: centmem-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum centmem-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
