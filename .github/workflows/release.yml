name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # centmem uses cgo (sqlite-vec + mattn/go-sqlite3). Each target is built on
    # a reliably available runner. The darwin/amd64 binary is cross-compiled on
    # the arm64 macOS runner via Apple's universal clang (-arch x86_64), because
    # the Intel macOS runner (macos-13) is being retired and is not reliably
    # schedulable. Artifacts are named from `go env` so they always reflect the
    # real binary.
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os: macos-latest        # arm64 (native)
          - goos: darwin
            goarch: amd64
            os: macos-latest        # arm64 host; cross-compile to x86_64 below
            cgo_cc: clang -arch x86_64
          - goos: linux
            goarch: amd64
            os: ubuntu-latest       # x64 (native)
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04-arm    # arm64 (native)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      # Derive the real GOOS/GOARCH from the build toolchain and build with it,
      # so the artifact name (and SHA256SUMS) always match the binary arch.
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cgo_cc }}
        run: |
          echo "Building ${GOOS}/${GOARCH} with CGO (CC=${CC:-native})"
          CGO_ENABLED=1 go build -tags fts5 -o "centmem-${GOOS}-${GOARCH}" ./cmd/centmem
          echo "Artifact:"
          file "centmem-${GOOS}-${GOARCH}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: centmem-${{ matrix.goos }}-${{ matrix.goarch }}
          path: centmem-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum centmem-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
